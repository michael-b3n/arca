# Coverage of arcstd by its tests: run gcovr in the repository root after ctest of gcc-coverage.
search-path = build
filter = arcstd/
# The header check compiles each header alone, it runs nothing
gcov-exclude-directories = .*_verify_interface_header_sets\.dir.*
# A line of a template counts as run if one of its instances runs it
merge-lines = yes
exclude-throw-branches = yes
exclude-unreachable-branches = yes
