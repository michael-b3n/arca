name: Build
description: Configure, build and test arca with MSYS2.

runs:
  using: composite
  steps:
    - name: Set up MSYS2
      uses: ./.github/actions/setup-msys2

    - name: Configure
      shell: msys2 {0}
      run: cmake --preset gcc-release

    - name: Build
      shell: msys2 {0}
      run: cmake --build --preset gcc-release

    - name: Test
      shell: msys2 {0}
      run: ctest --preset gcc-release
